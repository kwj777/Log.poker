      fill="#e8e4da" stroke="#2e3a35" stroke-width="1" />
    <text x="58" y="380" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="19"
      fill="#b7343f">J</text>
    <text x="78" y="416" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#b7343f">♥</text>
  </g>
  <g>
    <title>3 of spades</title>
