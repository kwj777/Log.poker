    <text x="342" y="220" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#242b28">♣</text>
  </g>
  <text x="140" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="9.5" letter-spacing="1.8"
    text-anchor="middle" fill="#828e89">FLOP</text>
  <text x="280" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="9.5" letter-spacing="1.8"
    text-anchor="middle" fill="#828e89">TURN</text>
  <text x="342" y="254" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="9.5" letter-spacing="1.8"
