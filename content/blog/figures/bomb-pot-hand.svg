<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 502" role="img"
  aria-labelledby="bomb-pot-hand-title bomb-pot-hand-desc">
  <title id="bomb-pot-hand-title">A double-board bomb pot, scooped</title>
  <desc id="bomb-pot-hand-desc">My hand: the two and four of diamonds. His hand: the jack of clubs and six of spades. Board one runs three, five and six of diamonds, then a jack of spades and a six of clubs, giving me a six-high straight flush and him sixes full of jacks. Board two runs the jack of hearts, three of spades and five of clubs, then the six of hearts, with the river unrecorded, giving me a six-high straight and him jacks and sixes. Gold-edged cards are the ones that made my hand.</desc>

  <text x="121.8" y="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="11" letter-spacing="2.2"
    text-anchor="middle" fill="#828e89">MY HAND</text>
  <g>
    <title>2 of diamonds</title>
    <rect x="63.8" y="26" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#c9a86a" stroke-width="2" />
    <text x="70.8" y="48" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="19"
      fill="#b7343f">2</text>
    <text x="90.8" y="84" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#b7343f">♦</text>
  </g>
  <g>
    <title>4 of diamonds</title>
    <rect x="125.8" y="26" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#c9a86a" stroke-width="2" />
    <text x="132.8" y="48" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="19"
      fill="#b7343f">4</text>
    <text x="152.8" y="84" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#b7343f">♦</text>
  </g>
  <text x="298.2" y="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="11" letter-spacing="2.2"
    text-anchor="middle" fill="#828e89">HIS HAND</text>
  <g>
    <title>Jack of clubs</title>
    <rect x="240.2" y="26" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#2e3a35" stroke-width="1" />
    <text x="247.2" y="48" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="19"
      fill="#242b28">J</text>
    <text x="267.2" y="84" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#242b28">♣</text>
  </g>
  <g>
