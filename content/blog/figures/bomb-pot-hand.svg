      fill="#e8e4da" stroke="#c9a86a" stroke-width="2" />
    <text x="120" y="380" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="19"
      fill="#242b28">3</text>
    <text x="140" y="416" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#242b28">♠</text>
  </g>
  <g>
