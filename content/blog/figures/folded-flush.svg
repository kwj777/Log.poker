<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 471" role="img"
  aria-labelledby="folded-flush-title folded-flush-desc">
  <title id="folded-flush-title">The flush that arrived after the fold</title>
  <desc id="folded-flush-desc">My hand: the ace of spades and a second spade whose rank I do not remember. The flop came the nine of spades, the seven of hearts and the two of clubs, leaving me ace high with a backdoor flush draw, and I folded to a bet. The turn was the four of spades and the river the queen of spades, which would have made me the nut flush. Gold-edged cards are the five spades that never got to be a hand.</desc>

  <text x="210" y="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="11" letter-spacing="2.2"
    text-anchor="middle" fill="#828e89">MY HAND</text>
  <g>
    <title>Ace of spades</title>
    <rect x="152" y="26" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#c9a86a" stroke-width="2" />
    <text x="159" y="48" font-family="Georgia,'Times New Roman',serif" font-size="19"
      fill="#242b28">A</text>
    <text x="179" y="84" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#242b28">♠</text>
  </g>
  <g>
    <title>A spade, and I could not tell you which</title>
    <rect x="214" y="26" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#c9a86a" stroke-width="2" stroke-dasharray="4 3" />
    <text x="221" y="48" font-family="Georgia,'Times New Roman',serif" font-size="19"
      fill="#8f8a80">?</text>
    <text x="241" y="84" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#242b28">♠</text>
  </g>
  <text x="210" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="11" letter-spacing="2.2"
    text-anchor="middle" fill="#828e89">FOLDED ON THE FLOP</text>
  <text x="210" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="11" letter-spacing="2.2"
    text-anchor="middle" fill="#828e89">THE FLOP</text>
  <g>
    <title>9 of spades</title>
    <rect x="121" y="207" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#c9a86a" stroke-width="2" />
    <text x="128" y="229" font-family="Georgia,'Times New Roman',serif" font-size="19"
      fill="#242b28">9</text>
    <text x="148" y="265" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#242b28">♠</text>
  </g>
  <g>
    <title>7 of hearts</title>
    <rect x="183" y="207" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#2e3a35" stroke-width="1" />
    <text x="190" y="229" font-family="Georgia,'Times New Roman',serif" font-size="19"
      fill="#b7343f">7</text>
    <text x="210" y="265" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#b7343f">♥</text>
  </g>
  <g>
    <title>2 of clubs</title>
    <rect x="245" y="207" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#2e3a35" stroke-width="1" />
    <text x="252" y="229" font-family="Georgia,'Times New Roman',serif" font-size="19"
      fill="#242b28">2</text>
    <text x="272" y="265" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#242b28">♣</text>
  </g>
  <text x="210" y="305" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#b7c0ba"><tspan font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="10" letter-spacing="1.8" fill="#828e89">ME </tspan>Ace high, and a backdoor draw</text>
  <text x="210" y="355" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="11" letter-spacing="2.2"
    text-anchor="middle" fill="#828e89">THE TURN AND THE RIVER</text>
  <g>
    <title>4 of spades</title>
    <rect x="152" y="365" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#c9a86a" stroke-width="2" />
    <text x="159" y="387" font-family="Georgia,'Times New Roman',serif" font-size="19"
      fill="#242b28">4</text>
    <text x="179" y="423" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#242b28">♠</text>
  </g>
  <g>
    <title>Queen of spades</title>
    <rect x="214" y="365" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#c9a86a" stroke-width="2" />
    <text x="221" y="387" font-family="Georgia,'Times New Roman',serif" font-size="19"
      fill="#242b28">Q</text>
    <text x="241" y="423" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#242b28">♠</text>
  </g>
  <text x="210" y="463" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="14" fill="#c9a86a"><tspan font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif" font-size="10" letter-spacing="1.8" fill="#828e89">WOULD HAVE BEEN </tspan>The nut flush</text>
</svg>
