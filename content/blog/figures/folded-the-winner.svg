  <title id="folded-the-winner-title">The winner I folded on the river</title>
  <desc id="folded-the-winner-desc">Every card in this hand is drawn face down, because I never logged it: not my two cards and not the board. What I do remember is when it happened, not long after one of the three coolers, and how it ended. I faced a bet on the river, folded, and had the best hand.</desc>

