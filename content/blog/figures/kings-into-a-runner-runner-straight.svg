<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 471" role="img"
  aria-labelledby="kings-into-a-runner-runner-straight-title kings-into-a-runner-runner-straight-desc">
  <title id="kings-into-a-runner-runner-straight-title">My kings against his five six suited, all in before the flop</title>
  <desc id="kings-into-a-runner-runner-straight-desc">My hand: two kings. His hand: a five and a six of the same suit. I do not have the suits of any of them, so they are drawn dashed. We were all in before the flop, where I was about a 77 percent favorite. The flop had a nine on it; the other two cards I do not remember. The turn was a seven and the river was an eight, which gave him a straight from five to nine.</desc>

  <text x="121.8" y="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="11" letter-spacing="2.2"
    text-anchor="middle" fill="#828e89">MY HAND</text>
