  <text x="210" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="11" letter-spacing="2.2"
    text-anchor="middle" fill="#828e89">ALL IN BEFORE THE FLOP. HE CALLED.</text>
