    <title>The King, and I could not tell you the suit</title>
    <rect x="63.8" y="26" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#2e3a35" stroke-width="1" stroke-dasharray="4 3" />
    <text x="70.8" y="48" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="19"
      fill="#8f8a80">K</text>
    <text x="90.8" y="84" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="27"
      text-anchor="middle" fill="#8f8a80">?</text>
  </g>
