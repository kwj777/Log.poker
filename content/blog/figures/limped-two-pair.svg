<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 471" role="img"
  aria-labelledby="limped-two-pair-title limped-two-pair-desc">
  <title id="limped-two-pair-title">The hand a two-dollar limp bought</title>
  <desc id="limped-two-pair-desc">My hand: the seven and eight of spades. The flop paired both of them and gave me two pair, eights and sevens. Its third card, the turn and the river are drawn face down, because I never wrote them down and cannot tell you what they were. Somebody made a bigger two pair by the river. Gold-edged cards are the ones that made my hand, and a dashed card is one I am not sure of.</desc>

  <text x="210" y="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="11" letter-spacing="2.2"
    text-anchor="middle" fill="#828e89">MY HAND</text>
  <g>
    <title>7 of spades</title>
    <rect x="152" y="26" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#c9a86a" stroke-width="2" />
    <text x="159" y="48" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="19"
      fill="#242b28">7</text>
    <text x="179" y="84" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#242b28">♠</text>
  </g>
  <g>
    <title>8 of spades</title>
    <rect x="214" y="26" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#c9a86a" stroke-width="2" />
    <text x="221" y="48" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="19"
      fill="#242b28">8</text>
    <text x="241" y="84" font-family="'Segoe UI Symbol','Apple Symbols','Arial Unicode MS','DejaVu Sans',sans-serif" font-size="27"
      text-anchor="middle" fill="#242b28">♠</text>
  </g>
  <text x="210" y="147" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="11" letter-spacing="2.2"
    text-anchor="middle" fill="#828e89">LIMPED FOR $2 ON THE BUTTON</text>
  <text x="210" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="11" letter-spacing="2.2"
    text-anchor="middle" fill="#828e89">THE FLOP</text>
  <g>
    <title>The 7, and I could not tell you the suit</title>
    <rect x="121" y="207" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#c9a86a" stroke-width="2" stroke-dasharray="4 3" />
    <text x="128" y="229" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="19"
      fill="#8f8a80">7</text>
    <text x="148" y="265" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="27"
      text-anchor="middle" fill="#8f8a80">?</text>
  </g>
  <g>
    <title>The 8, and I could not tell you the suit</title>
    <rect x="183" y="207" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#c9a86a" stroke-width="2" stroke-dasharray="4 3" />
    <text x="190" y="229" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="19"
      fill="#8f8a80">8</text>
    <text x="210" y="265" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="27"
      text-anchor="middle" fill="#8f8a80">?</text>
  </g>
  <g>
    <title>A card that was never shown</title>
    <rect x="245" y="207" width="54" height="76" rx="5"
      fill="#3d4a44" stroke="#2e3a35" stroke-width="1" />
    <g transform="translate(250 223) scale(0.22)"
      fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.75">
      <path d="M100 125 L100 163" stroke="#c9a86a" stroke-width="8" />
      <path d="M34 125 L166 125 L100 37 Z" stroke="#9aae80" stroke-width="6" />
      <path d="M56 125 L100 66 L144 125" stroke="#75886a" stroke-width="6" />
      <path d="M78 125 L100 96 L122 125" stroke="#55665e" stroke-width="6" />
    </g>
  </g>
  <text x="210" y="305" text-anchor="middle" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="14" fill="#c9a86a"><tspan font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="10" letter-spacing="1.8" fill="#828e89">ME </tspan>Two pair, eights and sevens</text>
  <text x="210" y="355" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="11" letter-spacing="2.2"
    text-anchor="middle" fill="#828e89">THE TURN AND THE RIVER</text>
  <g>
    <title>A card that was never shown</title>
    <rect x="152" y="365" width="54" height="76" rx="5"
      fill="#3d4a44" stroke="#2e3a35" stroke-width="1" />
    <g transform="translate(157 381) scale(0.22)"
      fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.75">
      <path d="M100 125 L100 163" stroke="#c9a86a" stroke-width="8" />
      <path d="M34 125 L166 125 L100 37 Z" stroke="#9aae80" stroke-width="6" />
      <path d="M56 125 L100 66 L144 125" stroke="#75886a" stroke-width="6" />
      <path d="M78 125 L100 96 L122 125" stroke="#55665e" stroke-width="6" />
    </g>
  </g>
  <g>
    <title>A card that was never shown</title>
    <rect x="214" y="365" width="54" height="76" rx="5"
      fill="#3d4a44" stroke="#2e3a35" stroke-width="1" />
    <g transform="translate(219 381) scale(0.22)"
      fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.75">
      <path d="M100 125 L100 163" stroke="#c9a86a" stroke-width="8" />
      <path d="M34 125 L166 125 L100 37 Z" stroke="#9aae80" stroke-width="6" />
      <path d="M56 125 L100 66 L144 125" stroke="#75886a" stroke-width="6" />
      <path d="M78 125 L100 96 L122 125" stroke="#55665e" stroke-width="6" />
    </g>
  </g>
  <text x="210" y="463" text-anchor="middle" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="14" fill="#b7c0ba"><tspan font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="10" letter-spacing="1.8" fill="#828e89">HIM </tspan>A bigger two pair</text>
</svg>
