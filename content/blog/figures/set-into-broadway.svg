    <text x="252" y="184" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="19"
      fill="#8f8a80">T</text>
    <text x="272" y="220" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="27"
      text-anchor="middle" fill="#8f8a80">?</text>
  </g>
  <text x="210" y="260" text-anchor="middle" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="14" fill="#c9a86a"><tspan font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="10" letter-spacing="1.8" fill="#828e89">ME </tspan>Top set</text>
  <text x="210" y="282" text-anchor="middle" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="14" fill="#b7c0ba"><tspan font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="10" letter-spacing="1.8" fill="#828e89">HIM </tspan>The nut straight</text>
  <text x="210" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="11" letter-spacing="2.2"
    text-anchor="middle" fill="#828e89">THE TURN AND THE RIVER</text>
  <g>
    <title>A card that was never shown</title>
    <rect x="152" y="342" width="54" height="76" rx="5"
      fill="#3d4a44" stroke="#2e3a35" stroke-width="1" />
    <g transform="translate(157 358) scale(0.22)"
      fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.75">
      <path d="M100 125 L100 163" stroke="#c9a86a" stroke-width="8" />
      <path d="M34 125 L166 125 L100 37 Z" stroke="#9aae80" stroke-width="6" />
      <path d="M56 125 L100 66 L144 125" stroke="#75886a" stroke-width="6" />
      <path d="M78 125 L100 96 L122 125" stroke="#55665e" stroke-width="6" />
    </g>
  </g>
