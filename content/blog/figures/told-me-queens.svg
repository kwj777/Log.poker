<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 515" role="img"
  aria-labelledby="told-me-queens-title told-me-queens-desc">
  <title id="told-me-queens-title">The hand she said she had</title>
  <desc id="told-me-queens-desc">My hand: an eight and a nine of the same suit, though I could not tell you which suit. Her two cards are drawn face down because they were never shown: she folded, and the only reason anybody believes they were queens is that she said so afterwards. The flop came two eights and a third card I did not write down, giving me trip eights. The turn was a nine, giving me eights full of nines. She called to see the river, which is also drawn face down and was not the queen she needed, and folded when I bet it.</desc>

  <text x="121.8" y="16" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Liberation Sans',Arial,sans-serif" font-size="11" letter-spacing="2.2"
    text-anchor="middle" fill="#828e89">MY HAND</text>
  <g>
    <title>The 8, and I could not tell you the suit</title>
    <rect x="63.8" y="26" width="54" height="76" rx="5"
      fill="#e8e4da" stroke="#c9a86a" stroke-width="2" stroke-dasharray="4 3" />
    <text x="70.8" y="48" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="19"
      fill="#8f8a80">8</text>
    <text x="90.8" y="84" font-family="Georgia,'Times New Roman','Liberation Serif','Nimbus Roman',serif" font-size="27"
      text-anchor="middle" fill="#8f8a80">?</text>
  </g>
  <g>
    <title>The 9, and I could not tell you the suit</title>
