<!doctype html>
<meta charset="utf-8">
<title>Log chip -- side 1</title>

<!-- The identity face: the family mark over log.poker, and the one line saying
     what kind of poker this is about. This is the side somebody turns over in
     their fingers while they decide whether to ask what it is. Side 2 is the
     side that answers.

     Rasterized by `npm run chip`.

     No ring, no edge spots, no denomination. A denomination would make this
     gambling scrip rather than a card protector, which is the same line the
     family draws around taking money from the gambling side of the business,
     and it applies to objects as much as to revenue.

     **The mark is the family's, so no ring is lit.** An app icon turns exactly
     one canopy ring gold; this disc stands for all three apps and its back
     names them, so it lights none. That is also what keeps the object from
     reading as Log-the-app's merchandise when it is the family's front door.

     The domain is set at full size here because the back carries no wordmark
     at all. The code there says where to go better than any typed URL does,
     but an object with no name on either face is anonymous once it is off the
     table, so the name lives on this one. -->

<link rel="stylesheet" href="face.css">
<script src="face.js"></script>
<style>
  /* The viewBox is the mark's own ink on the 200 grid, stroke widths included,
     rather than the full square.

     The paths run x 34..166 and y 37..163, and the outer stroke is 6 wide, so
     the ink reaches 31 and 169 across and 34 and 166 down. On a square canvas
     that margin is padding; here it is what "center the mark over the word"
     has to mean the mark rather than the mark's empty air, so it is cropped
     out. Getting this wrong is not subtle: Untilt's chip inherited a box cut
     for a different drawing and printed the baseline's round caps sliced flat
     at both ends. */
  .mark {
    display: block;
    width: 690px;
    height: 659px;
  }

  h1 {
    /* The bottom margin is not space under the word. Flex centers the column
       and a line box carries its ink high inside itself, so the pair sat below
       the middle of the disc; growing the column downward lifts it back. The
       lift now belongs to the line under it, which is the bottom of the
       column. */
    margin: 54px 0 46px;
    font-family: var(--sans);
    font-weight: 500;
    font-size: 208px;
    line-height: 1;
    /* Tighter than the site's, for the same reason the share card is: this is
       display size, where the page's tracking reads loose. */
    letter-spacing: -0.02em;
    color: var(--cream);
    white-space: nowrap;
  }

  /* The extension, quieter than the name. Same trick as the site's app cards,
     where the host sits under the app's name in the dim. */
  h1 .tld { color: var(--gold); }

  /* Who the object is for.

     This is the one thing neither face carried. The back spells the acronym
     and this face spells it out, but nothing on the disc said what kind of
     poker it is about, and the landing the code opens does not say it either:
     somebody who scans it cold could read Log as an online tracker.

     It is not the `Be the LOG` line coming back. That one pointed at the
     acronym the two faces already spell, which is the disc explaining itself
     to itself. This one carries something the object does not otherwise say.

     **The wording has to be true of all three apps**, because the mark above
     it lights no ring and the back names all three. `Built for live poker
     players` is Log's own claim and would be a promise on behalf of two apps
     that do not quite keep it, the same reason the landing qualifies its free
     claim as Log's. The live game is where all three sit: the drills are for
     the table, the log is of a session at one, and the meditations are for
     before and after it.

     **The size is a floor, not a preference.** The vendor's art guide asks for
     1.5mm of cap on the finished chip, and GROUND on the back measures 1.72mm
     of ink in the render. 80px lands at 1.57mm, and anything quiet enough to
     sit comfortably under the wordmark is under the floor: at 48px this line
     would be 0.94mm and would fire as a smudge. So the line is wider than the
     name above it. The name still leads on weight, with two and a half times
     the cap height, which is the relationship that survives a matte fire.

     Sage rather than gold, matching the verbs on the back. Gold here would
     compete with `.poker` directly above it, and the gold on this face is
     already spent on the trunk and the extension. */
  .live {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 80px;
    line-height: 1;
    /* Tighter than the back's 0.2em. The verbs there stand alone in their own
       bands; this one is a caption under a word and reads as one line rather
       than as separated letters. */
    letter-spacing: 0.14em;
    color: var(--canopy-outer);
    white-space: nowrap;
    /* The column's lift, moved down off the wordmark. */
    margin-bottom: 96px;
  }
</style>

<div class="face">
  <!-- The family mark, on the 200 grid it is drawn on in public/home.html and
       404.html: canopy in one green ramp, gold on the trunk, nothing lit. -->
  <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="31 34 138 132"
       role="img" aria-label="Three nested triangles sharing a baseline">
    <g fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M100 125 L100 163" stroke="#c9a86a" stroke-width="8" />
      <path d="M34 125 L166 125 L100 37 Z" stroke="#9aae80" stroke-width="6" />
      <path d="M56 125 L100 66 L144 125" stroke="#75886a" stroke-width="6" />
      <path d="M78 125 L100 96 L122 125" stroke="#55665e" stroke-width="6" />
    </g>
  </svg>

  <h1>log<span class="tld">.poker</span></h1>

  <div class="live">FOR THE LIVE GAME</div>
</div>
