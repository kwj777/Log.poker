# Netlify configuration for log.poker
#
# log.poker is the marketing site for three apps, and Log itself is under /app.
# `scripts/build-web.mjs` produces that shape: the Expo export moves under
# dist/app, and everything from `public/` stays at the root, which is why so
# few rules are needed below.

[build]
  # Not the bare export. `scripts/build-web.mjs` runs it and then moves the
  # output under dist/app, which is what puts the marketing site at the root
  # and Log under /app. Running the export alone deploys the app at / and no
  # front door at all, silently, so this line is asserted by a test.
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The card protector campaign, and the one route in here that is a promise
# rather than a convenience. Chips are permanent objects in the wild, so
# `/chip` has to resolve for as long as any of them exist, through every later
# rewrite of the app. It is a static file rather than a client route for
# exactly that reason, and these rules sit above the single-page catch-all
# because Netlify takes the first matching rule and the catch-all matches
# everything. `src/campaign/__tests__/chip.test.ts` asserts that ordering, so
# the guarantee survives somebody reorganizing this file.
[[redirects]]
  from = "/chip"
  to = "/chip.html"
  status = 200

[[redirects]]
  from = "/chip/"
  to = "/chip.html"
  status = 200

# The scan counter. Optional by design: the landing page renders and works
# with this returning nothing at all.
[[redirects]]
  from = "/api/chip-scan"
  to = "/.netlify/functions/chip-scan"
  status = 200

# The guides, at addresses without an extension on them.
#
# Netlify will usually serve /running-bad from running-bad.html on its own, but
# "usually" is a setting rather than a guarantee, and the canonical in each page
# names the extensionless address. These rules make the served path and the
# canonical path the same thing by configuration rather than by default, which
# is the same reasoning that gave /chip its own rules above. They sit before
# the single-page catch-all for the same reason it does.
[[redirects]]
  from = "/running-bad"
  to = "/running-bad.html"
  status = 200

[[redirects]]
  from = "/bankroll"
  to = "/bankroll.html"
  status = 200

[[redirects]]
  from = "/pot-odds"
  to = "/pot-odds.html"
  status = 200

[[redirects]]
  from = "/tilt"
  to = "/tilt.html"
  status = 200

# The .html address of each guide also resolves, because Netlify serves a real
# file before it consults these rules, so each page is reachable at two URLs.
# That is handled by the canonical in each document rather than by a forced
# 301 back to the pretty address: a 301 from /x.html to /x, sitting above a
# 200 from /x to /x.html, is one rule-engine detail away from a redirect loop,
# and the canonical does the whole job with none of that risk.

# The family page listed the three apps at /apps before the root did. One
# canonical page rather than two, and the old address keeps working.
[[redirects]]
  from = "/apps"
  to = "/"
  status = 301

# Log lives under /app, because log.poker is first of all the front door for
# three apps. `scripts/build-web.mjs` moves the whole export under dist/app, so
# every prerendered route is a real file at the path that serves it and this is
# the only rule the app needs: the client-router fallback for the paths that
# were never prerendered, like /app/session/<id>.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# No catch-all for the root. Netlify serves 404.html, which is a page rather
# than a wall, and an unknown address stops quietly resolving to the app.

# The service worker must never be served from a stale cache, or a deploy can
# take an unbounded amount of time to reach a returning visitor.
# The worker file sits at the root and controls /app only. A worker's scope is
# capped by where it is served from unless the server says otherwise, and this
# header is what lets one at / claim a narrower scope than /. Without it the
# registration in app/+html.tsx fails and the app silently loses offline.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Service-Worker-Allowed = "/app/"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# A permanent URL on a permanent object: a returning visitor has to get the
# current page rather than the one cached when their chip was new.
[[headers]]
  for = "/chip.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The blog is generated from content/blog at build time, so a post only exists
# once a deploy has happened. These pages must revalidate or a returning
# visitor keeps reading an index that has not heard about it.
[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"

# Bundler output is content-hashed, so it can be cached indefinitely.
[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
